<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cybersecurity Lab</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px 12px;
}
.box {
  max-width:420px;
  margin:30px auto;
  padding:25px;
  background:#202d40;
  border-radius:15px;
}
button {
  padding:13px 22px;
  margin:8px;
  border:0;
  border-radius:8px;
  background:#238636;
  color:white;
  font-size:16px;
}
.result {
  margin-top:20px;
  padding:12px;
  background:#142235;
  border-radius:8px;
}
</style>
</head>
<body>
<div class="box">
  <h1>مختبر الأمن السيبراني</h1>
  <p>بيئة تعليمية لاختبار أمان الروابط</p>
  <hr>
  <h3>اختبار فتح الصفحة</h3>
  <p>اضغط الزر لمعرفة نتيجة الاختبار.</p>
  <button onclick="runTest()">ابدأ الاختبار</button>
  <div class="result" id="result">
    بانتظار الاختبار...
  </div>
</div>

<script>
function runTest() {
  const browser = navigator.userAgent;
  const time = new Date().toLocaleString('ar');

  document.getElementById('result').innerHTML =
    '<b>نتيجة الاختبار</b><br>' +
    'تم فتح الصفحة بنجاح.<br>' +
    'وقت الزيارة: ' + time + '<br>' +
    'المتصفح: ' + browser +
    '<br><br>لم يتم إرسال أو حفظ بيانات شخصية.';
}
</script>
</body>
</html>
