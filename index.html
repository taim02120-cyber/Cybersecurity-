
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محاكاة وهمية</title>
<style>
body {
  margin: 0;
  padding: 55px 20px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: white;
}
h1 { font-size: 30px; font-weight: 500; }
h2 { font-size: 20px; font-weight: 400; margin-top: 35px; }
.panel {
  max-width: 350px;
  margin: 25px auto;
  padding: 22px;
  border: 1px solid #ccc;
  border-radius: 8px;
}
input {
  width: 90%;
  padding: 13px;
  text-align: center;
  font-size: 18px;
  border: 1px solid #bbb;
  border-radius: 5px;
}
button {
  margin-top: 15px;
  padding: 12px 25px;
  border: 0;
  border-radius: 5px;
  background: #168b78;
  color: white;
}
.note { color: #777; font-size: 13px; }
#result { margin-top: 15px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>واتساب</h1>
<h2>إدخال رمز تحقق</h2>
<div class="panel">
  <strong>إدخال رمز تحقق</strong>
  <p class="note">تجربة وهمية — لا تستخدم رمزاً حقيقياً</p>
  <input id="code" placeholder="أدخل نصاً تجريبياً">
  <button onclick="test()">اختبار</button>
  <div id="result"></div>
</div>
<script>
function test() {
  const value = document.getElementById("code").value;
  document.getElementById("result").textContent =
    value ? "تم استلام الإدخال التجريبي بنجاح." : "أدخل قيمة للاختبار.";
}
</script>
</body>
</html>
